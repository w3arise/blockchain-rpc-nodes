upstream rest_host {
  server rest:5551;
  keepalive 16;
}

upstream rest_java_host {
  server rest-java:8084;
  keepalive 16;
}

upstream web3_host {
  server web3:8545;
  keepalive 16;
}

server {
  listen 8080;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";

  location /api/v1/contracts/call {
    proxy_pass http://web3_host$request_uri;
  }

  location ~ "^/api/v1/contracts/results/((0x)?[A-Fa-f0-9]{64}|\d+\.\d+\.\d+-\d+-\d+)/opcodes" {
    proxy_pass http://web3_host$request_uri;
  }

  location /api/v1/network/ {
    proxy_pass http://rest_java_host$request_uri;
  }

  location /api/v1/ {
    proxy_pass http://rest_host$request_uri;
  }
}
