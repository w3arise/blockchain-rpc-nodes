name: ${COMPOSE_PROJECT_NAME:-polygon-bor}

services:
  bor:
    image: ${BOR_IMAGE}
    container_name: ${CONTAINER_NAME:-bor}
    init: true
    restart: unless-stopped
    stop_grace_period: ${STOP_GRACE_PERIOD:-5m}
    network_mode: host
    cpus: ${CPU_COUNT_LIMIT}
    env_file: .env
    environment:
      - GOGC=${GOGC}
      - GOMEMLIMIT=${GO_MEM_LIMIT}
    mem_limit: ${MEM_LIMIT}
    memswap_limit: ${MEM_LIMIT}
    command:
      - server
      - --config=/config/${BOR_CONFIG}
      - --chain=${CHAIN}
      - --datadir=/data
      - --bootnodes=${BOOTNODES}
      - --discovery.dns=${DISCOVERY_DNS}
      - --db.engine=${BOR_DB_ENGINE}
      - --state.scheme=${BOR_STATE_SCHEME}
      - --syncmode=${BOR_SYNCMODE}
      - --gcmode=${BOR_GCMODE}
      - --history.transactions=${BOR_HISTORY_TRANSACTIONS}
      - --history.logs=${BOR_HISTORY_LOGS}
      - --history.state=${BOR_HISTORY_STATE}
      - --port=${P2P_PORT}
      - --nat=extip:${EXT_IP}
      - --bor.heimdall=${HEIMDALL_URL}
      - --bor.logs=${BOR_LOGS}
      - --cache=${CACHE}
      - --rpc.gascap=${GAS_CAP}
      - --rpc.txfeecap=${RPC_TX_FEE_CAP}
      - --rpc.returndatalimit=${RPC_RETURNDATA_LIMIT}
      - --http
      - --http.addr=${RPC_BIND_ADDR}
      - --http.port=${HTTP_PORT}
      - --http.api=${HTTP_API}
      - --ws
      - --ws.addr=${RPC_BIND_ADDR}
      - --ws.port=${WS_PORT}
      - --ws.api=${WS_API}
    volumes:
      - ${HOST_DATADIR:-$HOME/polygon-bor-data}:/data
      - ./config:/config:ro
    logging:
      options:
        max-size: "10m"
        max-file: "3"
