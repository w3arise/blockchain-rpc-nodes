# Polygon PoS mainnet Bor config (from 0xPolygon/bor v2.10.0 archive template,
# adapted for Docker). CLI flags in docker-compose.yml override scheme / retention /
# NAT / Heimdall / ports.

chain = "mainnet"
datadir = "/data"
syncmode = "full"
snapshot = true

[p2p]
 maxpeers = 200
 bind = "0.0.0.0"
 # port / nat come from compose (--port, --nat=extip)
