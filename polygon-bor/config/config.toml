 dns = ["enrtree://AKUEZKN7PSKVNR65FZDHECMKOJQSGPARGTPPBI7WS2VUL4EGR6XPC@pos.polygon-peers.io"]

[txpool]
 nolocals = true
 pricelimit = 25000000000
 accountslots = 16
 globalslots = 131072
 accountqueue = 64
 globalqueue = 131072
 lifetime = "1h30m0s"

[miner]
 gaslimit = 45000000
 gasprice = "25000000000"

[jsonrpc]
 ipcpath = "/data/bor.ipc"
 [jsonrpc.http]
 enabled = true
 # host / port come from compose (--http.addr, --http.port)
 api = ["eth", "net", "web3", "txpool", "bor", "debug"]
 vhosts = ["*"]
 corsdomain = ["*"]
 [jsonrpc.ws]
 enabled = true
 # host / port come from compose (--ws.addr, --ws.port)
 api = ["eth", "net", "web3", "txpool", "bor", "debug"]
 origins = ["*"]

[gpo]
 ignoreprice = "25000000000"

[telemetry]
 metrics = true

[cache]
 cache = 4096
 gc = 0
 snapshot = 20
