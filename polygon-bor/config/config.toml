# Polygon PoS Bor config (from 0xPolygon/bor v2.10.0 archive template, adapted
# for Docker). Network (chain / bootnodes / DNS), scheme, retention, NAT,
# Heimdall, and ports come from compose CLI flags.

datadir = "/data"
syncmode = "full"
snapshot = true

[p2p]
 maxpeers = 200
 bind = "0.0.0.0"
 # port / nat / bootnodes / dns come from compose

[txpool]
 nolocals = true
 pricelimit = 25000000000
 accountslots = 16
 globalslots = 131072
 accountqueue = 64
 globalqueue = 131072
 lifetime = "1h30m0s"

[miner]
 gaslimit = 45000000
 gasprice = "25000000000"

[jsonrpc]
 ipcpath = "/data/bor.ipc"
 [jsonrpc.http]
 enabled = true
 # host / port come from compose (--http.addr, --http.port)
 api = ["eth", "net", "web3", "txpool", "bor", "debug"]
 vhosts = ["*"]
 corsdomain = ["*"]
 [jsonrpc.ws]
 enabled = true
 # host / port come from compose (--ws.addr, --ws.port)
 api = ["eth", "net", "web3", "txpool", "bor", "debug"]
 origins = ["*"]

[gpo]
 ignoreprice = "25000000000"

[telemetry]
 metrics = true

[cache]
 cache = 4096
 gc = 0
 snapshot = 20
