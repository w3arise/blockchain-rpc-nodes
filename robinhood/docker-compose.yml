services:
  robinhood:
    image: ${NITRO_IMAGE}
    container_name: robinhood
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "${RPC_BIND_ADDR:-127.0.0.1}:${HTTP_PORT}:8547"
      - "${RPC_BIND_ADDR:-127.0.0.1}:${WS_PORT}:8548"
    environment:
      # Empty = no Go memory limit.
      GOMEMLIMIT: ${GOMEMLIMIT:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${HOME}/robinhood-data:/home/user/.arbitrum"
      - "./config/robinhood-chain-info.json:/config/robinhood-chain-info.json:ro"
      - "./config/robinhood-genesis.json:/config/robinhood-genesis.json:ro"
    command:
      - --parent-chain.connection.url=${L1_ETH_URL}
      - --parent-chain.blob-client.beacon-url=${L1_ETH_BEACON_URL}
      - --node.feed.input.url=${FEED_URLS:?set FEED_URLS in .env (see env.template)}
      - --init.genesis-json-file=/config/robinhood-genesis.json
      - --chain.info-files=/config/robinhood-chain-info.json
      - --chain.id=${CHAIN_ID}
      - --http.addr=0.0.0.0
      - --http.port=8547
      - --http.vhosts=*
      - --http.api=${HTTP_API}
      - --ws.addr=0.0.0.0
      - --ws.port=8548
      - --ws.api=${WS_API}
      - --ws.origins=*
      - --node.staker.enable=false
      - --execution.forwarding-target=${FORWARDING_TARGET}
      - --execution.tx-indexer.tx-lookup-limit=0
      - --execution.caching.state-scheme=${STATE_SCHEME}
      - --execution.caching.state-history=${STATE_HISTORY}
      - --execution.caching.archive
      # Empty in .env = Nitro v3.12 defaults (MB).
      - --execution.caching.database-cache=${CACHE_DATABASE_MB:-2048}
      - --execution.caching.snapshot-cache=${CACHE_SNAPSHOT_MB:-400}
      - --execution.caching.trie-clean-cache=${CACHE_TRIE_CLEAN_MB:-600}
      - --execution.caching.trie-dirty-cache=${CACHE_TRIE_DIRTY_MB:-1024}
      - --execution.rpc.tx-fee-cap=${TX_FEE_CAP}
      - --execution.rpc.gas-cap=${GAS_CAP}
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    init: true
    stop_grace_period: 120s
