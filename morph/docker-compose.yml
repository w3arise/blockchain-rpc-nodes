# No env_file: only the variables below reach the container (see compose.node.yml).
services:
  morph-geth:
    image: ${GETH_IMAGE}
    container_name: morph-geth
    restart: unless-stopped
    stop_grace_period: 120s
    environment:
      - MORPH_FLAG=${MORPH_FLAG}
      - EXT_IP=${EXT_IP}
      - GETH_P2P_PORT=${GETH_P2P_PORT}
      - GETH_TX_LOOKUP_LIMIT=${GETH_TX_LOOKUP_LIMIT:-0}
      - GETH_GCMODE=${GETH_GCMODE:-archive}
      - GAS_CAP=${GAS_CAP:-600000000}
    volumes:
      - ${GETH_DATADIR:-$HOME/morph-geth-data}:/db
      - ./config/jwt.hex:/config/jwt.hex:ro
      - ./entrypoint-geth.sh:/entrypoint.sh:ro
    ports:
      - ${RPC_BIND_ADDR:-127.0.0.1}:${HTTP_HOST_PORT}:8545
      - ${RPC_BIND_ADDR:-127.0.0.1}:${WS_HOST_PORT}:8546
      - ${METRICS_BIND_ADDR:-127.0.0.1}:${GETH_METRICS_HOST_PORT}:6060
      - ${GETH_P2P_PORT}:${GETH_P2P_PORT}
      - ${GETH_P2P_PORT}:${GETH_P2P_PORT}/udp
    entrypoint:
      - /bin/sh
      - /entrypoint.sh
    networks:
      - morph-network

  # Shared definition in compose.node.yml; only the geth-specific parts here.
  morph-node:
    extends:
      file: compose.node.yml
      service: morph-node
    depends_on:
      morph-geth:
        condition: service_started
    environment:
      - MORPH_NODE_L2_ETH_RPC=http://morph-geth:8545
      - MORPH_NODE_L2_ENGINE_RPC=http://morph-geth:8551
      - MORPH_NODE_SYNC_START_HEIGHT=${L1_MSG_START_HEIGHT}
    volumes:
      - ${NODE_DATADIR:-$HOME/morph-node-data}:/db

networks:
  morph-network:
    driver: bridge
