services:
  l1dtl:
    image: ${DTL_IMAGE}
    container_name: metis-l1dtl
    restart: unless-stopped
    stop_grace_period: 120s
    env_file:
      - .env
      - config/l1dtl.env
    volumes:
      - ${HOST_DTL_DATADIR:-$HOME/metis-l1dtl-data}:/data
    networks:
      - metis

  l2geth:
    image: ${L2GETH_IMAGE}
    container_name: metis-l2geth
    restart: unless-stopped
    stop_grace_period: 120s
    depends_on:
      - l1dtl
    env_file:
      - .env
      - config/l2geth.env
    volumes:
      - ${HOST_L2GETH_DATADIR:-$HOME/metis-l2geth-data}:/root/.ethereum
    ports:
      - ${RPC_BIND_ADDR}:${HTTP_PORT}:8545
      - ${RPC_BIND_ADDR}:${WS_PORT}:8546
      - ${P2P_PORT}:${P2P_PORT}
      - ${P2P_PORT}:${P2P_PORT}/udp
    networks:
      - metis

networks:
  metis:
    name: metis
