name: Tag-only auto-upgrade

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check and write same-series pin bumps
        env:
          AUTO_UPGRADE_PR_BODY: ${{ runner.temp }}/auto-upgrade-pr-body.md
        run: |
          ./scripts/check-auto-upgrades.sh --write
          if [[ ! -f "${AUTO_UPGRADE_PR_BODY}" ]]; then
            printf '%s\n' "Same-series tag-only pin bump from \`scripts/auto-upgrade.yaml\`." > "${AUTO_UPGRADE_PR_BODY}"
          fi

      - name: Open pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto-upgrade/tag-only
          delete-branch: true
          add-paths: |
            **/env.template
            CHAIN_LINKS.md
          title: Bump tag-only client pins
          commit-message: |
            Bump tag-only client pins.

            Same-series image tags only (scripts/auto-upgrade.yaml).
          body-path: ${{ runner.temp }}/auto-upgrade-pr-body.md

      - name: Comment pin table on the PR
        if: steps.cpr.outputs.pull-request-number != ''
        uses: actions/github-script@v7
        env:
          AUTO_UPGRADE_PR_BODY: ${{ runner.temp }}/auto-upgrade-pr-body.md
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- auto-upgrade-pin-table -->';
            const table = fs.readFileSync(process.env.AUTO_UPGRADE_PR_BODY, 'utf8');
            const body = `${marker}\n${table}`;
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number }
            );
            const existing = comments.find(
              (c) =>
                c.user?.login === 'github-actions[bot]' &&
                typeof c.body === 'string' &&
                c.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
