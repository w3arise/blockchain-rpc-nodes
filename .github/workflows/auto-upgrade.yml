name: Tag-only auto-upgrade

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-pins:
    name: Bump tag-only pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check and write same-series pin bumps
        env:
          AUTO_UPGRADE_PR_BODY: ${{ runner.temp }}/auto-upgrade-pr-body.md
        run: |
          ./scripts/check-auto-upgrades.sh --write
          if [[ ! -f "${AUTO_UPGRADE_PR_BODY}" ]]; then
            printf '%s\n' "Same-series tag-only pin bump from \`scripts/config/auto-upgrade.yaml\`." > "${AUTO_UPGRADE_PR_BODY}"
          fi

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto-upgrade/tag-only
          delete-branch: true
          add-paths: |
            **/env.template
            CHAIN_LINKS.md
          title: Bump tag-only client pins
          commit-message: |
            Bump tag-only client pins.

            Same-series image tags only (scripts/config/auto-upgrade.yaml).
          body-path: ${{ runner.temp }}/auto-upgrade-pr-body.md
