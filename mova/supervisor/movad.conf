[program:movad]
; Vendor supervisord hardcodes --pruning=nothing (archive). PRUNING comes from .env.
command=movad start --home /data --pruning=%(ENV_PRUNING)s --rpc.unsafe --rpc.grpc_laddr tcp://0.0.0.0:26680 --rpc.laddr tcp://0.0.0.0:26657 --log_level state:info
priority=1
autostart=true
autorestart=true
startsecs=15
startretries=100
stdout_logfile=/data/stdout-movad.txt
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=3
stderr_logfile=/data/stderr-movad.txt
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
