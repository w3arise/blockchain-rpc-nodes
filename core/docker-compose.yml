services:
  core-node:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GETH_VERSION: ${GETH_VERSION}
    image: core-geth:${GETH_VERSION}
    container_name: core-node
    restart: unless-stopped
    stop_grace_period: 120s
    env_file:
      - .env
    entrypoint: [geth]
    command:
      - --config=/config/config.toml
      - --datadir=/data
      - --syncmode=${SYNC_MODE}
      - --gcmode=${GCMODE}
      - --state.scheme=${STATE_SCHEME}
      - --history.transactions=${HISTORY_TRANSACTIONS}
      - --cache=${CACHE}
      - --maxpeers=${MAX_PEERS}
      - --nat=extip:${EXT_IP}
      - --port=${P2P_PORT}
      - --discovery.port=${P2P_PORT}
      - --http
      - --http.addr=0.0.0.0
      - --http.port=${HTTP_PORT}
      - --http.api=${HTTP_API}
      - --http.vhosts=*
      - --http.corsdomain=*
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.port=${WS_PORT}
      - --ws.api=${WS_API}
      - --ws.origins=*
      - --rpc.allow-unprotected-txs
      - --rpc.gascap=${GAS_CAP}
      - --verbosity=${VERBOSITY}
    volumes:
      - ${HOST_DATADIR:-$HOME/core-data}:/data
      - ./config/config.toml:/config/config.toml:ro
    ports:
      - "${P2P_PORT}:${P2P_PORT}/tcp"
      - "${P2P_PORT}:${P2P_PORT}/udp"
      - "127.0.0.1:${HTTP_PORT}:${HTTP_PORT}"
      - "127.0.0.1:${WS_PORT}:${WS_PORT}"
    logging:
      options:
        max-size: "10m"
        max-file: "3"
