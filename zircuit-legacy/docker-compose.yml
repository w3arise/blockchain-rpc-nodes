services:
  zircuit-historical-op-geth:
    image: ${L2_GETH_IMAGE}
    container_name: zircuit-historical-op-geth
    platform: linux/amd64
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    user: root
    env_file: .env
    environment:
      GETH_ROLLUP_DISABLETXPOOLGOSSIP: "true"
      GETH_ROLLUP_SEQUENCERHTTP: ${SEQUENCER_HTTP}
      GETH_TXPOOL_GLOBALQUEUE: "1024"
      ZIRCUIT_NETWORK: mainnet
    entrypoint: ["/bin/sh", "-c", "exec geth \"$@\"", "--"]
    command:
      - --datadir=/data
      - --db.engine=pebble
      - --gcmode=full
      - --maxpeers=0
      - --metrics
      - --metrics.addr=0.0.0.0
      - --metrics.port=6060
      - --network=mainnet
      - --nodiscover
      - --rpc.gascap=${GAS_CAP}
      - --rpc.txfeecap=0
      - --txlookuplimit=0
      - --state.scheme=hash
      - --syncmode=full
      - --http
      - --http.addr=0.0.0.0
      - --http.api=eth,net,web3,debug,txpool
      - --http.port=8545
      - --http.vhosts=*
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.api=eth,net,web3,debug,txpool
      - --ws.origins=*
      - --ws.port=8546
    restart: unless-stopped
    stop_grace_period: 5m
    volumes:
      - ${HOST_DATADIR:-$HOME/zircuit-historical-data}:/data
    ports:
      - ${RPC_BIND_ADDR}:${HTTP_PORT}:8545
      - ${RPC_BIND_ADDR}:${WS_PORT}:8546
