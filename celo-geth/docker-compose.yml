name: celo-mainnet

services:
  # Frozen read-only mainnet replica: serves the existing datadir only.
  # No peers, no sequencer forwarding, no txpool/debug APIs.
  op-geth:
    image: ${OP_GETH_IMAGE}
    platform: linux/amd64
    container_name: celo-mainnet-op-geth
    restart: unless-stopped
    stop_grace_period: 5m
    entrypoint: geth
    command:
      - --datadir=/geth
      - --http
      - --http.corsdomain=*
      - --http.vhosts=*
      - --http.addr=0.0.0.0
      - --http.port=8545
      - --http.api=eth,net,web3
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.port=8546
      - --ws.origins=*
      - --ws.api=eth,net,web3
      - --rpc.gascap=${GAS_CAP:-600000000}
      - --syncmode=full
      - --gcmode=full
      - --nodiscover
      - --maxpeers=0
      - --rollup.disabletxpoolgossip=true
      - --history.transactions=0
      - --txpool.nolocals
      - --verbosity=3
    volumes:
      - ${HOST_DATADIR:-$HOME/celo-op-geth-data}:/geth
    ports:
      - ${RPC_BIND_ADDR:-127.0.0.1}:${HTTP_PORT:-8441}:8545
      - ${RPC_BIND_ADDR:-127.0.0.1}:${WS_PORT:-8442}:8546
