services:
  zircuit-op-reth:
    image: ${OP_RETH_IMAGE}
    container_name: zircuit-op-reth
    platform: linux/amd64
    entrypoint: ["op-reth"]
    command:
      - node
      - --chain=/config/genesis.json
      - --datadir=/data
      - --rollup.sequencer=${SEQUENCER_HTTP}
      - --rollup.historicalrpc=${HISTORICAL_RPC}
      - --rollup.disable-tx-pool-gossip
      - --http
      - --http.addr=0.0.0.0
      - --http.port=8545
      - --http.api=web3,debug,eth,txpool,net,trace
      - --http.corsdomain=*
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.port=8546
      - --ws.api=web3,debug,eth,txpool,net,trace
      - --ws.origins=*
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=9551
      - --authrpc.jwtsecret=/config/jwt.hex
      - --rpc.gascap=${GAS_CAP}
      - --nat=extip:${EXT_IP}
      - --port=${P2P_PORT}
      - --discovery.addr=0.0.0.0
      - --discovery.port=${P2P_PORT}
      - --discovery.v5.port=${P2P_PORT}
      - --bootnodes=${OP_RETH_BOOTNODES}
    volumes:
      - ${HOST_DATADIR:-$HOME/zircuit-op-reth-data}:/data
      - ./config:/config:ro
    ports:
      - ${RPC_BIND_ADDR}:${HTTP_PORT}:8545
      - ${RPC_BIND_ADDR}:${WS_PORT}:8546
      - ${P2P_PORT}:${P2P_PORT}
      - ${P2P_PORT}:${P2P_PORT}/udp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    stop_grace_period: 120s
    networks:
      - zircuit-network

  zircuit-op-node:
    image: ${OP_NODE_IMAGE}
    container_name: zircuit-op-node
    platform: linux/amd64
    command:
      - op-node
    env_file: .env
    environment:
      OP_NODE_P2P_LISTEN_TCP_PORT: ${OP_NODE_P2P_PORT}
      OP_NODE_P2P_LISTEN_UDP_PORT: ${OP_NODE_P2P_PORT}
    depends_on:
      zircuit-op-reth:
        condition: service_started
    volumes:
      - ${HOST_OP_NODE_DATADIR:-$HOME/zircuit-op-node-data}:/data
      - ./config:/config:ro
    ports:
      - ${RPC_BIND_ADDR}:${OP_NODE_RPC_PORT}:${OP_NODE_RPC_PORT}
      - ${OP_NODE_P2P_PORT}:${OP_NODE_P2P_PORT}
      - ${OP_NODE_P2P_PORT}:${OP_NODE_P2P_PORT}/udp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - zircuit-network

networks:
  zircuit-network:
    driver: bridge
