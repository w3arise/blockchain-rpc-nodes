services:
  optimism-op-reth:
    image: ${OP_RETH_IMAGE}
    container_name: optimism-op-reth
    ports:
      - ${RPC_BIND_ADDR:-127.0.0.1}:${HTTP_PORT}:8545
      - ${RPC_BIND_ADDR:-127.0.0.1}:${WS_PORT}:8546
      - ${P2P_PORT}:${P2P_PORT}
      - ${P2P_PORT}:${P2P_PORT}/udp
    volumes:
        - ${HOST_DATADIR:-$HOME/optimism-op-reth-data}:/data
        - ./config:/config
    entrypoint: ["op-reth"]
    command:
      - node
      - --chain=optimism
      - --storage.v2
      - --datadir=/data
      - --rollup.sequencer-http=https://mainnet-sequencer.optimism.io/
      - --rollup.historicalrpc=https://mainnet.optimism.io
      - --rollup.disable-tx-pool-gossip
      - --http
      - --http.addr=0.0.0.0
      - --http.port=8545
      - --http.api=web3,eth,txpool,net
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.port=8546
      - --ws.api=web3,eth,txpool,net
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=9551
      - --authrpc.jwtsecret=/config/jwt.hex
      - --rpc.gascap=${GAS_CAP}
      - --rpc.max-connections=${RPC_MAX_CONNECTIONS:-500}
      - --rpc.max-logs-per-response=${RPC_MAX_LOGS_PER_RESPONSE:-20000}
      - --rpc.max-blocks-per-filter=${RPC_MAX_BLOCKS_PER_FILTER:-100000}
      - --rpc-cache.max-concurrent-db-requests=${RPC_CACHE_MAX_CONCURRENT_DB_REQUESTS:-512}
      - --engine.cross-block-cache-size=${ENGINE_CROSS_BLOCK_CACHE_SIZE:-4096}
      - --nat=extip:${EXT_IP}
      - --port=${P2P_PORT}
      - --discovery.addr=0.0.0.0
      - --discovery.port=${P2P_PORT}
      - --discovery.v5.port=${P2P_PORT}
      - --metrics=127.0.0.1:9001
    restart: unless-stopped
    stop_grace_period: 120s
    networks:
      - optimism-network

  optimism-op-node:
    profiles: ["op-node"]
    image: ${OP_NODE_IMAGE}
    container_name: optimism-op-node
    command:
      - op-node
    env_file: .env
    environment:
      OP_NODE_P2P_LISTEN_TCP_PORT: ${OP_NODE_P2P_PORT}
      OP_NODE_P2P_LISTEN_UDP_PORT: ${OP_NODE_P2P_PORT}
    ports:
      - ${RPC_BIND_ADDR:-127.0.0.1}:${OP_NODE_RPC_PORT}:${OP_NODE_RPC_PORT}
      - ${OP_NODE_P2P_PORT}:${OP_NODE_P2P_PORT}
      - ${OP_NODE_P2P_PORT}:${OP_NODE_P2P_PORT}/udp
    volumes:
      - ${HOST_OP_NODE_DATADIR:-$HOME/optimism-op-node-data}:/data
      - ./config:/config
    restart: unless-stopped
    depends_on:
      optimism-op-reth:
        condition: service_started
    networks:
      - optimism-network

  optimism-kona-node:
    profiles: ["kona"]
    image: ${KONA_NODE_IMAGE:-us-docker.pkg.dev/oplabs-tools-artifacts/images/kona-node:v1.10.0}
    container_name: optimism-kona-node
    entrypoint: ["kona-node"]
    command:
      - node
      - --chain=optimism
      - --l1-eth-rpc=${OP_NODE_L1_ETH_RPC}
      - --l1-beacon=${OP_NODE_L1_BEACON}
      - --l2-engine-rpc=http://optimism-op-reth:9551
      - --l2-engine-jwt-secret=/config/jwt.hex
      - --rpc.addr=0.0.0.0
      - --port=9545
      - --p2p.listen.ip=0.0.0.0
      - --p2p.listen.tcp=${KONA_P2P_PORT:-9223}
      - --p2p.listen.udp=${KONA_P2P_PORT:-9223}
      - --p2p.advertise.ip=${EXT_IP}
      - --p2p.priv.path=/data/p2p-priv.txt
      - --p2p.bootstore=/data
      - --safedb.path=/data/safedb
    ports:
      - ${RPC_BIND_ADDR:-127.0.0.1}:${KONA_RPC_PORT:-8994}:9545
      - ${KONA_P2P_PORT:-9223}:${KONA_P2P_PORT:-9223}
      - ${KONA_P2P_PORT:-9223}:${KONA_P2P_PORT:-9223}/udp
    volumes:
      - ${HOST_KONA_DATADIR:-$HOME/optimism-kona-data}:/data
      - ./config:/config:ro
    restart: unless-stopped
    stop_grace_period: 360s
    depends_on:
      optimism-op-reth:
        condition: service_started
    networks:
      - optimism-network

networks:
  optimism-network:
    driver: bridge
