# Tag-only auto-upgrade allowlist.
#
# Lookup rules stay in CLIENT_UPDATES.md. This file is the machine-readable
# subset: chains that may auto-PR and host-apply a same-series pin swap.
# Do not store “latest” tags here — scripts re-check upstream each run.
#
# Add a chain only when compose, genesis, JWT, and datadir layout stay the
# same across patch tags on the currently pinned major.minor series.
# Crossing a minor/major line is always needs-review (human bump onto the
# new series, then auto can follow patches on that series).

chains:
  - id: aptos
    class: tag-only
    env_file: aptos/env.template
    var: APTOS_IMAGE
    image_prefix: "aptoslabs/validator:"
    compose_dir: aptos
    chain_links: true
    source_type: github_releases
    source_repo: aptos-labs/aptos-core
    tag_prefix: aptos-node-v
    exclude: "-rc,-alpha,-beta,-unsafe,-testnet"
    health_path: /v1
    health_port_var: HTTP_PORT
    health_bind_var: RPC_BIND_ADDR

  # Nitro docker tags are vX.Y.Z-<hash> (not the bare git tag). CI still lists
  # OffchainLabs/nitro git tags; --write copies the image named in the release body.
  - id: arbitrum
    class: tag-only
    env_file: arbitrum/env.template
    var: NITRO_IMAGE
    image_prefix: "offchainlabs/nitro-node:"
    compose_dir: arbitrum
    chain_links: false
    source_type: github_releases
    source_repo: OffchainLabs/nitro
    tag_prefix: v
    exclude: "-rc,-alpha,-beta,-unsafe,-testnet"
    image_tag_from: release_body
