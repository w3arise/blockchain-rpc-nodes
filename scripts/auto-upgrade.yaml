# Tag-only auto-upgrade allowlist.
#
# Lookup rules stay in CLIENT_UPDATES.md. This file is the machine-readable
# subset: chains that may auto-PR and host-apply a same-series pin swap.
# Do not store “latest” tags here — scripts re-check upstream each run.
#
# Add a chain only when compose, genesis, JWT, and datadir layout stay the
# same across patch tags on the currently pinned major.minor series.
# Crossing a minor/major line is always needs-review (human bump onto the
# new series, then auto can follow patches on that series).

chains:
  - id: aptos
    class: tag-only
    env_file: aptos/env.template
    var: APTOS_IMAGE
    image_prefix: "aptoslabs/validator:"
    compose_dir: aptos
    chain_links: true
    source_type: github_releases
    source_repo: aptos-labs/aptos-core
    tag_prefix: aptos-node-v
    exclude: "-rc,-alpha,-beta,-unsafe,-testnet"
    health_path: /v1
    health_port_var: HTTP_PORT
    health_bind_var: RPC_BIND_ADDR

  # Nitro docker tags are vX.Y.Z-<hash> (not the bare git tag). CI still lists
  # OffchainLabs/nitro git tags; --write copies the image named in the release body.
  - id: arbitrum
    class: tag-only
    env_file: arbitrum/env.template
    var: NITRO_IMAGE
    image_prefix: "offchainlabs/nitro-node:"
    compose_dir: arbitrum
    chain_links: false
    source_type: github_releases
    source_repo: OffchainLabs/nitro
    tag_prefix: v
    exclude: "-rc,-alpha,-beta,-unsafe,-testnet"
    image_tag_from: release_body
    health_mode: block_time
    health_port_var: HTTP_PORT

  - id: berachain
    class: tag-only
    env_file: berachain/env.template
    var: BERA_RETH_IMAGE
    image_prefix: "ghcr.io/berachain/bera-reth:"
    compose_dir: berachain
    chain_links: false
    source_type: github_releases
    source_repo: berachain/bera-reth
    tag_prefix: v
    exclude: "-rc,-alpha,-beta,-unsafe,-testnet"

  # Conduit OP Stack: two pins per chain (execution + op-node). Host apply
  # uses apply_group (e.g. ./scripts/apply-tag-only.sh katana). Git tags
  # op-reth/v* and op-node/v* map to docker tags v* via strip_git_prefix.
  - id: bob-op-reth
    class: tag-only
    env_file: bob/env.template
    var: OP_RETH_IMAGE
    image_prefix: "us-docker.pkg.dev/oplabs-tools-artifacts/images/op-reth:"
    compose_dir: bob
    apply_group: bob
    chain_links: false
    source_type: github_releases
    source_repo: ethereum-optimism/optimism
    tag_prefix: op-reth/v
    strip_git_prefix: "op-reth/"
    exclude: "-rc,-alpha,-beta,-unsafe,-testnet,-pr,-falcorocks"

  - id: bob-op-node
    class: tag-only
    env_file: bob/env.template
    var: OP_NODE_IMAGE
    image_prefix: "us-docker.pkg.dev/oplabs-tools-artifacts/images/op-node:"
    compose_dir: bob
    apply_group: bob
    chain_links: false
    source_type: github_releases
    source_repo: ethereum-optimism/optimism
    tag_prefix: op-node/v
    strip_git_prefix: "op-node/"
    exclude: "-rc,-alpha,-beta,-unsafe,-testnet,-pr"

  # Version-only pin; local image core-geth:${GETH_VERSION} is built on apply.
  - id: core
    class: tag-only
    env_file: core/env.template
    var: GETH_VERSION
    image_prefix: ""
    compose_dir: core
    chain_links: false
    source_type: github_releases
    source_repo: coredao-org/core-chain
    tag_prefix: v
    exclude: "-rc,-alpha,-beta,-unsafe,-testnet"
    compose_build: true

